# Partie 1 : recharger data/offres.ndjson dans l'index "offres".
input {
  file {
    path => "/data/offres*.ndjson"
    mode => "read"
    codec => "json"
    sincedb_path => "/dev/null"
    file_completed_action => "log"
    file_completed_log_path => "/usr/share/logstash/data/offres_lus.log"
  }
}

filter {
  # Le mapping de l'index "offres" est en dynamic: strict.
  # On retire donc les champs techniques ajoutés automatiquement par Logstash.
  mutate {
    remove_field => ["@timestamp", "@version", "event", "host", "log"]
  }
}

output {
  elasticsearch {
    hosts => ["${ES_HOSTS}"]
    user => "${ES_USER}"
    password => "${ES_PASSWORD}"
    index => "offres"
    document_id => "%{id}"
    action => "index"
    data_stream => "false"
    manage_template => false
  }
}
